name: Docker

on:
  push:
    # Publish `master` as `latest` and `v1.2.3` tags as `1.2.3` and `1.2`
    branches:
      - master
    tags:
      - v*
  pull_request:
  # Also run by debian-updates.yml when Debian has updates for a published image
  workflow_dispatch:

# One run per branch or tag at a time, so an older build can't overwrite the
# image of a newer one. A new push to a pull request cancels its running test.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every published platform is built and tested natively on a matching runner
  test:
    name: test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Start the compose stack
        run: |
          cp .env.example .env
          docker compose up --detach --build --wait --wait-timeout 600

      - name: Check the image architecture
        run: |
          arch="$(docker compose exec -T nedi dpkg --print-architecture)"
          echo "nedi runs on $arch"
          test "$arch" = "${{ matrix.arch }}"

      - name: Log into the web GUI
        run: |
          curl -fsS -c cookies http://localhost:8080/index.php > /dev/null
          curl -fsS -b cookies -c cookies -d 'user=admin&pass=admin&s=Login' http://localhost:8080/index.php > /dev/null
          curl -fsS -b cookies http://localhost:8080/System-Services.php | grep -q 'moni.pl'

      - name: Recreating the container keeps the database
        run: |
          sql() { docker compose exec -T db sh -c 'mariadb -unedi -p"$MARIADB_PASSWORD" nedi -Nse "$0"' "$1"; }
          sql "INSERT INTO sysvars (name, value) VALUES ('ci-marker', '1')"
          docker compose up --detach --force-recreate --wait --wait-timeout 300 nedi
          sql "SELECT value FROM sysvars WHERE name = 'ci-marker'" | grep -qx 1

      - name: Show logs
        if: always()
        run: docker compose logs

  push:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/nedi
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # GitHub reports the repository's license as GPL-3.0 (only)
          labels: |
            org.opencontainers.image.licenses=GPL-3.0-or-later

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cached apt layers would keep outdated Debian packages, so rebuilds
          # (for Debian updates or manual) start from scratch, which also
          # refreshes the cache
          no-cache: ${{ github.event_name == 'workflow_dispatch' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
