# NeDi web GUI, modelled after the nginx site of NeDi's nedian.sh installer.
# TLS is expected to be terminated by a reverse proxy in front of the container.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/nedi/html;
    index index.php;

    # Allow uploads of NeDi update tarballs, floor plans etc.
    client_max_body_size 128m;

    # NeDi's JSON API
    location /api {
        rewrite ^/api/(\w*)$ /query.php?t=$1&q=$args last;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        # Stream output of long running actions (e.g. discovery from the GUI)
        fastcgi_buffering off;
        fastcgi_read_timeout 1h;
    }
}
