[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

; All programs log to the container output (docker compose logs)
[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
autorestart=true

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
autorestart=true

; Runs the discovery schedule maintained in the GUI (System > Setup > Schedule)
[program:cron]
command=/usr/sbin/cron -f
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
autorestart=true

[program:moni]
command=/var/nedi/moni.pl
directory=/var/nedi
user=www-data
environment=HOME="/var/nedi",USER="www-data"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
autorestart=true
startretries=10

[program:syslog]
command=/var/nedi/syslog.pl -p 1514
directory=/var/nedi
user=www-data
environment=HOME="/var/nedi",USER="www-data"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
autorestart=true
startretries=10

[program:snmptrapd]
; Reads /etc/snmp/snmptrapd.conf and Debian's snmp.conf (which disables MIB loading)
command=/usr/sbin/snmptrapd -f -Lo udp:1162
directory=/var/nedi
user=www-data
environment=HOME="/var/nedi",USER="www-data",SNMP_PERSISTENT_DIR="/var/lib/snmp"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
autorestart=true

; Same options as NeDi's nedian.sh: one sub directory per exporter (-M) and
; expiry of old data (-e) within the limits set by "nfexpire -u" at first start
[program:nfcapd]
command=/usr/bin/nfcapd -M /var/nfdump -p 2055 -z=lz4 -e
directory=/var/nfdump
user=www-data
environment=HOME="/var/nedi",USER="www-data"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
autorestart=true
