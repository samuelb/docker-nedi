name: nedi

services:
  db:
    # Same MariaDB release as the client in Debian trixie
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: nedi
      MARIADB_USER: nedi
      MARIADB_PASSWORD: ${NEDI_DB_PASSWORD:?set NEDI_DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set MARIADB_ROOT_PASSWORD in .env}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 1m
      interval: 10s
      timeout: 5s
      retries: 3

  nedi:
    image: ghcr.io/samuelb/nedi:latest
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NEDI_DB_HOST: db
      NEDI_DB_NAME: nedi
      NEDI_DB_USER: nedi
      NEDI_DB_PASSWORD: ${NEDI_DB_PASSWORD:?set NEDI_DB_PASSWORD in .env}
      TZ: ${TZ:-UTC}
    ports:
      - "${NEDI_HTTP_PORT:-8080}:80/tcp"
      - "${NEDI_SYSLOG_PORT:-514}:1514/udp"
      - "${NEDI_TRAP_PORT:-162}:1162/udp"
      - "${NEDI_NETFLOW_PORT:-2055}:2055/udp"
    volumes:
      - nedi:/var/nedi
      - nfdump:/var/nfdump

volumes:
  db:
  nedi:
  nfdump:
